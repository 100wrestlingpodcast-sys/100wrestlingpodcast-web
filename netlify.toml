[build]
  command = "npm run build"
  publish = "dist"
  functions = "netlify/functions"

[build.environment]
  NODE_VERSION = "20"
  NPM_FLAGS = "--legacy-peer-deps"

[functions]
  node_bundler = "esbuild"

# Redirect netlify.app subdomain to primary domain
[[redirects]]
  from = "https://100wrestlingpodcast.netlify.app/*"
  to = "https://100wrestlingpodcast.com/:splat"
  status = 301
  force = true

[[redirects]]
  from = "http://100wrestlingpodcast.netlify.app/*"
  to = "https://100wrestlingpodcast.com/:splat"
  status = 301
  force = true

# Proxy functions correctly if called without prefix
[[redirects]]
  from = "/api/latest-live"
  to = "/.netlify/functions/latest-live"
  status = 200

# Single Page App routing
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
