<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sin Conexión | 100% Wrestling Podcast</title>
  <style>
    body {
      background-color: #080808;
      color: #ffffff;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      margin: 0;
      padding: 20px;
      box-sizing: border-box;
      text-align: center;
    }
    .container {
      max-width: 480px;
      padding: 40px 20px;
      border: 1px solid rgba(255, 255, 255, 0.05);
      background: rgba(20, 20, 20, 0.8);
      border-radius: 12px;
      box-shadow: 0 10px 30px rgba(217, 0, 0, 0.1);
    }
    .logo {
      width: 120px;
      height: 120px;
      margin-bottom: 24px;
      border-radius: 50%;
      border: 3px solid #D90000;
      box-shadow: 0 0 15px rgba(217, 0, 0, 0.3);
    }
    h1 {
      font-size: 28px;
      margin: 0 0 12px;
      font-weight: 800;
      letter-spacing: -0.5px;
    }
    p {
      color: #9ca3af;
      font-size: 16px;
      line-height: 1.5;
      margin: 0 0 24px;
    }
    .btn {
      display: inline-block;
      background-color: #D90000;
      color: #ffffff;
      padding: 12px 24px;
      font-size: 15px;
      font-weight: 600;
      text-decoration: none;
      border-radius: 6px;
      transition: background-color 0.2s;
    }
    .btn:hover {
      background-color: #FF2020;
    }
  </style>
</head>
<body>
  <div class="container">
    <img src="/logo.png" alt="100% Wrestling Podcast Logo" class="logo" onerror="this.style.display='none'">
    <h1>Estás sin conexión</h1>
    <p>Actualmente no tienes conexión a internet. Revisa tu red y vuelve a intentarlo. Puedes seguir accediendo a las secciones que ya hayas visitado.</p>
    <a href="/" class="btn">Reintentar conexión</a>
  </div>
</body>
</html>
